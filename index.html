<!doctype html>
<html lang="id">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Professional Markdown Renderer dengan support Mermaid, Syntax Highlighting, KaTeX, dan fitur lengkap untuk dokumen kantor." />
        <meta name="author" content="WanForge" />
        <title>WanForge - Markdown Renderer Profesional</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/atom-one-light.min.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css" />
        <link rel="stylesheet" href="./styles.css" />
    </head>

    <body>
        <header class="topbar">
            <div class="brand">
                <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                </svg>
                <span>WanForge Markdown</span>
            </div>
            <div class="actions">
                <button id="btnSample" type="button">Contoh</button>
                <button id="btnOpen" type="button">Buka File</button>
                <button id="btnPrint" type="button">Cetak</button>
                <button id="btnExport" type="button">Export</button>
                <button id="btnTheme" type="button">Tema</button>
                <input id="fileInput" type="file" accept=".md,.markdown,.txt" hidden />
            </div>
        </header>

        <main class="layout">
            <section class="pane editor-pane">
                <div class="pane-title">Editor Markdown</div>
                <textarea id="editor" spellcheck="false"></textarea>
            </section>

            <section class="pane preview-pane">
                <div class="pane-title">Preview</div>
                <div id="toc" class="toc"></div>
                <article id="preview" class="markdown-body"></article>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024-2026 <strong>WanForge</strong> | <a href="https://wanforge.asia" target="_blank">wanforge.asia</a></p>
                <p class="footer-subtitle">Professional Markdown Renderer dengan Mermaid, Syntax Highlight, KaTeX, dan lebih banyak fitur.</p>
            </div>
        </footer>

        <script type="module" src="./app.js"></script>
    </body>

</html>
