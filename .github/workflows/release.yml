name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Update CHANGELOG.md
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DATE=$(date +%Y-%m-%d)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_HASH=$(git log -1 --pretty=%h)

          {
            head -n 3 CHANGELOG.md
            printf '\n## v%s - %s\n\n' "$VERSION" "$DATE"
            printf -- '- %s\n' "$COMMIT_MSG"
            printf -- '- Commit: %s\n' "$COMMIT_HASH"
            printf '\n'
            tail -n +4 CHANGELOG.md
          } > CHANGELOG.new.md

          mv CHANGELOG.new.md CHANGELOG.md

      - name: Format code and changelog
        run: npm run format

      - name: Commit changelog update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for v${{ steps.version.outputs.version }}" --allow-empty

      - name: Build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Push changelog update
        run: |
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Archive dist
        run: tar -czf markdown-live-dist-${{ steps.version.outputs.tag }}.tar.gz dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: markdown-live-dist-${{ steps.version.outputs.tag }}.tar.gz
